# Static site: no build step. Netlify publishes this folder as it is.
[build]
  publish = "."

# Images and audio rarely change, so let browsers keep them for a month.
[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
